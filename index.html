<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6-Digit Code Screen Share</title>
  <!-- PeerJS Library CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }
    .code-display {
      background: #0f172a;
      border: 2px dashed #3b82f6;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .code-number {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #38bdf8;
      font-family: monospace;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
    }
    input {
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      flex-grow: 1;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Screen Share (6-Digit Room Code)</h2>
    
    <div class="code-display">
      <div style="font-size: 14px; color: #94a3b8; margin-bottom: 5px;">YOUR 6-DIGIT CODE</div>
      <div class="code-number" id="my-id">------</div>
    </div>

    <div class="controls">
      <!-- Host Button -->
      <button id="share-btn">1. Share My Screen</button>
      
      <!-- Viewer Inputs -->
      <input type="text" id="remote-id-input" placeholder="Enter 6-digit code" maxlength="6">
      <button id="connect-btn">2. Watch Stream</button>
    </div>

    <!-- Video Element -->
    <video id="remote-video" autoplay playsinline controls></video>
  </div>

  <script>
    // Helper function to generate a random 6-digit number string
    function generate6DigitCode() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    const sixDigitId = generate6DigitCode();
    const myIdDisplay = document.getElementById('my-id');
    const shareBtn = document.getElementById('share-btn');
    const connectBtn = document.getElementById('connect-btn');
    const remoteIdInput = document.getElementById('remote-id-input');
    const videoElement = document.getElementById('remote-video');

    // Initialize PeerJS with the generated 6-digit numerical ID
    const peer = new Peer(sixDigitId);

    peer.on('open', (id) => {
      myIdDisplay.innerText = id;
    });

    // Handle collision if the 6-digit ID is already taken by someone else on the PeerJS cloud server
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        alert('Code collision occurred. Reloading to get a fresh code...');
        window.location.reload();
      }
    });

    // 1. HOST: Start Screen Sharing
    shareBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: true
        });

        // Show local screen preview
        videoElement.srcObject = stream;

        // Listen for incoming viewer connections
        peer.on('call', (call) => {
          call.answer(stream);
        });

        alert(`Screen sharing live! Share your 6-digit code (${sixDigitId}) with the other device.`);
      } catch (err) {
        console.error("Failed to share screen:", err);
      }
    });

    // 2. VIEWER: Connect to Host using the 6-digit Code
    connectBtn.addEventListener('click', () => {
      const targetCode = remoteIdInput.value.trim();
      if (targetCode.length !== 6) {
        alert("Please enter a valid 6-digit code.");
        return;
      }

      // Call host using the entered 6-digit code
      const call = peer.call(targetCode, null);

      call.on('stream', (remoteStream) => {
        videoElement.srcObject = remoteStream;
      });

      call.on('error', (err) => {
        console.error("Connection error:", err);
        alert("Could not connect to code: " + targetCode);
      });
    });
  </script>
</body>
</html>
