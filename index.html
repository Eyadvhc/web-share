<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Link Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main 2-Column Dashboard */
    .dashboard {
      background-color: #1e293b;
      width: 100%;
      max-width: 900px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h2 {
      font-size: 1.25rem;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
    }

    /* Input & Control Section (Left) */
    .input-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-add {
      background-color: #0284c7;
      color: white;
    }

    .btn-delete-single {
      background-color: #eab308;
      color: #0f172a;
    }

    .btn-delete-all {
      background-color: #ef4444;
      color: white;
    }

    /* Scrollable Links Section (Right) */
    .links-container {
      height: 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 6px;
    }

    /* Scrollbar Styling */
    .links-container::-webkit-scrollbar {
      width: 6px;
    }

    .links-container::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 4px;
    }

    .links-container::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    .link-item {
      background-color: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* Plain Text Output (Unclickable & Easy to Copy) */
    .plain-text-link {
      color: #e2e8f0;
      font-size: 0.9rem;
      word-break: break-all;
      user-select: all; /* Allows single-click text highlighting */
    }

    .btn-item-del {
      background-color: #dc2626;
      color: white;
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- LEFT COLUMN: Controls -->
    <div class="column">
      <h2>Add & Manage Links</h2>
      <div class="input-box">
        <input type="text" id="linkInput" placeholder="Paste your link or text here..." required />
        <div class="button-group">
          <button class="btn-add" onclick="addLink()">Upload Link</button>
          <button class="btn-delete-single" onclick="deleteLatestLink()">Delete Latest Link</button>
          <button class="btn-delete-all" onclick="deleteAllLinks()">Delete All Links</button>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Shared Links Feed -->
    <div class="column">
      <h2>Shared Links (Plain Text)</h2>
      <div class="links-container" id="linksList">
        <div class="empty-state">Loading links...</div>
      </div>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, query, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG
// ❌ THIS IS STILL USING PLACEHOLDERS:
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

    let database;
    let linksRef;

    try {
      const app = initializeApp(firebaseConfig);
      database = getDatabase(app);
      linksRef = ref(database, 'links');

      // Real-time updates
      onValue(linksRef, (snapshot) => {
        linksList.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
          linksList.innerHTML = '<div class="empty-state">No links shared yet.</div>';
          return;
        }

        const entries = Object.entries(data).reverse();
        entries.forEach(([key, item]) => {
          const div = document.createElement('div');
          div.className = 'link-item';

          // Escape HTML special characters to prevent script execution
          const safeText = document.createTextNode(item.url).textContent;

          div.innerHTML = `
            <span class="plain-text-link">${safeText}</span>
            <button class="btn-item-del" onclick="deleteLinkByKey('${key}')">Delete</button>
          `;
          linksList.appendChild(div);
        });
      }, (error) => {
        linksList.innerHTML = `<div class="empty-state" style="color:#ef4444;">Database Error: ${error.message}</div>`;
      });

    } catch (err) {
      linksList.innerHTML = `<div class="empty-state" style="color:#ef4444;">Config Error: ${err.message}</div>`;
    }

    const linkInput = document.getElementById('linkInput');
    const linksList = document.getElementById('linksList');

    // 1. Upload Link as Plain Text
    window.addLink = function() {
      const url = linkInput.value.trim();
      if (!url) return;

      if (!linksRef) {
        alert("Firebase config missing!");
        return;
      }

      push(linksRef, {
        url: url,
        timestamp: Date.now()
      }).then(() => {
        linkInput.value = '';
      }).catch((error) => {
        alert("Upload failed: " + error.message);
      });
    };

    // 2. Delete Single Link by Key
    window.deleteLinkByKey = function(key) {
      remove(ref(database, `links/${key}`));
    };

    // 3. Delete Latest Link
    window.deleteLatestLink = function() {
      const latestQuery = query(linksRef, limitToLast(1));
      get(latestQuery).then((snapshot) => {
        if (snapshot.exists()) {
          const keyToDelete = Object.keys(snapshot.val())[0];
          remove(ref(database, `links/${keyToDelete}`));
        }
      });
    };

    // 4. Delete All Links
    window.deleteAllLinks = function() {
      if (confirm("Are you sure you want to delete all shared links?")) {
        remove(linksRef);
      }
    };
  </script>
</body>
</html>
