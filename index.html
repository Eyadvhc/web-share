<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live P2P Screen Share</title>
  <!-- Load PeerJS Library from CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 20px;
    }
    input {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      flex-grow: 1;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .status-box {
      background: #334155;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      margin-bottom: 15px;
      word-break: break-all;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Screen Share (Peer-to-Peer)</h2>
    
    <div class="status-box">
      <strong>Your Peer ID:</strong> <span id="my-id">Generating ID...</span>
    </div>

    <div class="controls">
      <!-- Host Button -->
      <button id="share-btn">1. Share My Screen</button>
      
      <!-- Viewer Controls -->
      <input type="text" id="remote-id-input" placeholder="Enter Host Peer ID">
      <button id="connect-btn">2. Watch Stream</button>
    </div>

    <!-- Video Element -->
    <video id="remote-video" autoplay playsinline controls></video>
  </div>

  <script>
    // Initialize PeerJS (Connects to free PeerJS cloud signaling server)
    const peer = new Peer();

    const myIdSpan = document.getElementById('my-id');
    const shareBtn = document.getElementById('share-btn');
    const connectBtn = document.getElementById('connect-btn');
    const remoteIdInput = document.getElementById('remote-id-input');
    const videoElement = document.getElementById('remote-video');

    // Display assigned Peer ID
    peer.on('open', (id) => {
      myIdSpan.innerText = id;
    });

    // 1. HOST: Start Screen Sharing
    shareBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: true
        });

        // Show local preview
        videoElement.srcObject = stream;

        // Answer incoming viewer connections with the screen stream
        peer.on('call', (call) => {
          call.answer(stream);
        });

        alert("Screen sharing started! Send your Peer ID to the other device so they can connect.");
      } catch (err) {
        console.error("Failed to share screen:", err);
      }
    });

    // 2. VIEWER: Connect to Host
    connectBtn.addEventListener('click', () => {
      const remoteId = remoteIdInput.value.trim();
      if (!remoteId) {
        alert("Please enter the Host's Peer ID first.");
        return;
      }

      // Call the host without sending a local video stream
      const call = peer.call(remoteId, null);

      call.on('stream', (remoteStream) => {
        // Display host's incoming screen stream
        videoElement.srcObject = remoteStream;
      });

      call.on('error', (err) => {
        console.error("Connection error:", err);
        alert("Failed to connect. Check the ID and try again.");
      });
    });
  </script>
</body>
</html>
